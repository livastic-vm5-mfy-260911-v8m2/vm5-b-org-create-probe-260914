name: VM5 App Bot PR Probe
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create app-bot PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c vm5-appbot-rebase-probe-260915
          printf 'VM5 app-bot rebase provenance discriminator 2026-09-15\n' > vm5-appbot-rebase-marker-260915.txt
          git add vm5-appbot-rebase-marker-260915.txt
          git commit -m "test: app bot rebase probe"
          git push origin HEAD
          gh pr create --base main --head vm5-appbot-rebase-probe-260915 --title "VM5_APPBOT_REBASE_PROBE_20260915" --body "Controlled GitHub App-authored PR rebase provenance discriminator."

