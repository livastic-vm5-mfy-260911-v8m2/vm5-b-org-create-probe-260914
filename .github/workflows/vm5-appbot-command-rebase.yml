name: VM5 App Bot Rebase Command Probe
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post GitHub App rebase command
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/issues/4/comments -f body='@Mergifyio rebase'

